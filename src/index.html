<div class="app" id="app">

    <nav class="sidebar__section" aria-label="Primary">
      <a class="nav-item" href="#home" data-nav="home"><svg class="icon"><use href="#i-home"/></svg>Home</a>
      <a class="nav-item" href="#search" data-nav="search"><svg class="icon"><use href="#i-search"/></svg>Search</a>

      <a class="nav-item" href="#voice" data-nav="voice"><svg class="icon"><use href="#i-mic"/></svg>Voice recordings<span class="nav-item__count" id="count-voice"></span></a>
    </nav>

      <div class="eyebrow sidebar__label">Playlists</div>
      <a class="nav-item nav-item--playlist" href="#playlist/0" data-nav="playlist:0"><svg class="icon icon--16"><use href="#i-heart"/></svg><span class="truncate">Liked songs</span></a>
      <div id="sidebar-playlist-list" class="sidebar__section"></div>
      <button class="nav-item nav-item--playlist" type="button" data-action="new-playlist"><svg class="icon icon--16"><use href="#i-plus"/></svg>New playlist</button>
    </div>
    <div class="sidebar__section sidebar__foot">
      <a class="nav-item" href="#settings" data-nav="settings"><svg class="icon"><use href="#i-settings"/></svg>Settings</a>
    </div>
  </aside>

  <div class="main" id="main">
    <header class="topbar" id="topbar">
      <a class="btn btn--icon topbar__back" id="topbar-back" href="#home" aria-label="Back" hidden><svg class="icon"><use href="#i-chevron-left"/></svg></a>
      <div class="topbar__title phone-only" id="topbar-title"></div>
      <div class="search desktop-only" id="topbar-search"><svg class="icon"><use href="#i-search"/></svg><input class="search__input" id="topbar-search-input" placeholder="Search YouTube Music and your library" aria-label="Search" autocomplete="off"><span class="search__kbd">Ctrl K</span></div>

      <span class="topbar__trail-slot phone-only" id="topbar-trail"></span>
    </header>
    <div class="view" id="view"></div>
  </div>
